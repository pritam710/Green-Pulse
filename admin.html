<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Green Pulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col overflow-hidden">
    
    <header class="bg-white p-4 shadow-md z-10 flex justify-between items-center px-8 border-b">
        <div class="flex items-center">
            <a href="index.html" class="mr-4 text-gray-400 hover:text-green-600 transition"><i class="fa-solid fa-house text-xl"></i></a>
            <div>
                <h2 class="text-2xl font-black text-gray-800">Admin Control Panel</h2>
                <p class="text-sm font-semibold text-gray-500">Live GIS Mapping & Spatial Routing</p>
            </div>
        </div>
        <div class="flex gap-4">
            <div id="report-counter" class="bg-red-50 border border-red-200 text-red-700 px-5 py-2 rounded-xl font-bold shadow-sm flex items-center"><i class="fa-solid fa-circle-exclamation mr-2"></i>3 Active Reports</div>
            <div class="bg-green-50 border border-green-200 text-green-700 px-5 py-2 rounded-xl font-bold shadow-sm flex items-center"><i class="fa-solid fa-truck-fast mr-2"></i>12 Fleet Active</div>
        </div>
    </header>

    <div id="map" class="flex-1 w-full z-0"></div>

    <script>
        // Centered for the presentation
        const map = L.map('map').setView([17.6599, 75.9064], 14); 

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '© OpenStreetMap'
        }).addTo(map);

        const redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34],
        });
        const greenIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34],
        });

        L.marker([17.6610, 75.9080], {icon: redIcon}).addTo(map).bindPopup("<div style='text-align:center;'><b>Critical Priority</b><br>Overflowing mixed waste.<br><span style='color:red;'>Status: Unassigned</span></div>");
        L.marker([17.6550, 75.9120], {icon: redIcon}).addTo(map).bindPopup("<div style='text-align:center;'><b>High Priority</b><br>Illegal dump site.<br><span style='color:orange;'>Status: Pending</span></div>");
        L.marker([17.6580, 75.9010], {icon: greenIcon}).addTo(map).bindPopup("<div style='text-align:center;'><b>Sanitation Fleet 4</b><br>Status: En route to task.</div>");
        // --- SIMULATED BACKEND INTEGRATION ---
        // 1. Pull dynamic reports from Local Storage
        let reports = JSON.parse(localStorage.getItem('greenPulseReports')) || [];
        
        // 2. Update the counter at the top of the screen
        document.getElementById('report-counter').innerHTML = `<i class="fa-solid fa-circle-exclamation mr-2"></i>${3 + reports.length} Active Reports`;

        // 3. Drop a new red pin on the map for every user report
        reports.forEach(report => {
            L.marker([report.lat, report.lng], {icon: redIcon}).addTo(map)
             .bindPopup(`<div style='text-align:center;'><b>Live Citizen Report</b><br>${report.desc}<br><span style='color:red;'>Status: Unassigned</span></div>`);
        });
    </script>
</body>
</html>
